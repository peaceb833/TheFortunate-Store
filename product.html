<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | TheFortunateStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<div class="wrap" id="main"></div>
<section class="sec" id="relWrap"><div class="wrap" style="padding:0"><div class="sec-head"><h2>You May Also Like</h2></div><div class="grid" id="rel"></div></div></section>
<div id="ftr"></div>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
layout("shop");
const SW = { White:"#FFFFFF", Black:"#111111", Navy:"#1F2A55", Charcoal:"#3A3A3A", Sand:"#D9C7A3", "Sky blue":"#9DB8E0", Tan:"#C9A063", Brown:"#5A3A25", Plum:"#7A2E57", Ivory:"#F4EFE3", Champagne:"#E6D3B0", Gold:"#C79A5B", Cream:"#F1E8D6", Nude:"#E2C2A6", "Off-white":"#EEEAE0", Natural:"#E4D3B0", Camel:"#C19A6B", Stone:"#BDB6A8", "Gold print":"#C79A5B", "Blue print":"#3E5C9A", "Black / Brown":"#3A2A20" };
const p = byId(new URLSearchParams(location.search).get("id"));
if (!p) {
  $("#main").innerHTML = `<div class="empty"><h2>We couldn't find that product</h2><p style="margin:10px auto 20px">It may have been removed.</p><a class="btn" href="shop.html">Back to shop</a></div>`;
  $("#relWrap").remove();
} else {
  document.title = p.name + " | " + S.name;
  let size = p.sizes.length === 1 ? p.sizes[0] : "", color = p.colors.length === 1 ? p.colors[0] : "", qty = 1, view = 0;
  const who = p.gender === "unisex" ? "Men" : p.gender === "men" ? "Men" : "Women";
  $("#main").innerHTML = `
  <div class="crumbs"><a href="index.html">Home</a> &gt; <a href="shop.html?g=${p.gender === "women" ? "women" : "men"}">${who}</a> &gt; <a href="shop.html?c=${p.cat}">${CAT_LABEL[p.cat]}</a> &gt; ${esc(p.name)}</div>
  <div class="pd">
    <div class="thumbs" id="thumbs">${[0, 1, 2, 3].map(i => `<button class="${i === 0 ? "on" : ""}" data-i="${i}" aria-label="Photo ${i + 1}">${art(p, i)}</button>`).join("")}</div>
    <div class="main" style="position:relative"><div id="big">${art(p)}</div>${heart(p.id)}</div>
    <div>
      <h1>${esc(p.name)}</h1>
      <span class="price">${money(p.price)}</span>
      <p style="margin-bottom:20px">${esc(p.desc)}</p>
      <b>Colour:</b> <span id="cname" class="muted">${color ? esc(color) : "Choose one"}</span>
      <div class="swatches" id="colors">${p.colors.map(c => `<button class="sw ${c === color ? "on" : ""}" data-v="${esc(c)}" style="background:${SW[c] || "#999"}" title="${esc(c)}" aria-label="${esc(c)}"></button>`).join("")}</div>
      <b>Size:</b>
      <div class="opts" id="sizes">${p.sizes.map(s => `<button class="opt ${s === size ? "on" : ""}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div id="err" class="msg err" style="display:none"></div>
      <b>Quantity:</b>
      <div style="margin:8px 0 18px"><div class="qty"><button id="minus" aria-label="Fewer">−</button><span id="q">1</span><button id="plus" aria-label="More">+</button></div></div>
      <button class="btn block" id="add" style="margin-bottom:10px">Add to Cart</button>
      <button class="btn dark block" id="now">Buy Now</button>
      <div class="perks"><span>Free delivery on orders above ${money(S.freeDeliveryOver)}</span><span>Secure payment by card, transfer or USSD</span></div>
    </div>
  </div>
  <div class="ptabs" id="ptabs"><button class="on" data-t="d">Description</button><button data-t="s">Delivery info</button></div>
  <div class="ptab" id="ptab"></div>`;
  const tabs = {
    d: `<p>${esc(p.desc)}</p>`,
    s: `<p>We deliver across Nigeria to the address saved on your account. Delivery costs ${money(S.deliveryFee)}, and is free on orders above ${money(S.freeDeliveryOver)}. We will call you on your phone number if we need anything to deliver.</p>`
  };
  $("#ptab").innerHTML = tabs.d;
  $("#ptabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; $$("#ptabs button").forEach(x => x.classList.toggle("on", x === b)); $("#ptab").innerHTML = tabs[b.dataset.t]; };
  $("#thumbs").onclick = e => { const b = e.target.closest("button"); if (!b) return; $$("#thumbs button").forEach(x => x.classList.toggle("on", x === b)); $("#big").innerHTML = art(p, +b.dataset.i); };
  const pick = (id, set) => $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", $(id)).forEach(x => x.classList.remove("on")); b.classList.add("on"); set(b.dataset.v); $("#err").style.display = "none";
  });
  pick("#colors", v => { color = v; $("#cname").textContent = v; }); pick("#sizes", v => size = v);
  $("#minus").onclick = () => { qty = Math.max(1, qty - 1); $("#q").textContent = qty; };
  $("#plus").onclick = () => { qty = Math.min(10, qty + 1); $("#q").textContent = qty; };
  const ready = () => {
    if (!color || !size) { const e = $("#err"); e.textContent = "Choose a " + (!color ? "colour" : "size") + (!color && !size ? " and a size" : "") + " first."; e.style.display = "block"; return false; }
    addToCart(p.id, size, color, qty); return true;
  };
  $("#add").onclick = () => { if (ready()) toast("Added to cart"); };
  $("#now").onclick = () => { if (ready()) location.href = "cart.html"; };
  $("#rel").innerHTML = PRODUCTS.filter(x => x.id !== p.id && (x.cat === p.cat || x.gender === p.gender)).slice(0, 4).map(tile).join("");
}
</script>
</body>
</html>
